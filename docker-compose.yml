version: "3.9"

services:

  backend:
    container_name: fastapi-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    restart: unless-stopped

    networks:
      - fastapi-network

  frontend:
    container_name: fastapi-frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile

    depends_on:
      - backend

    ports:
      - "80:80"

    restart: unless-stopped

    networks:
      - fastapi-network

networks:
  fastapi-network:
    driver: bridge
